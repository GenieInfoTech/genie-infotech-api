name: Deploy to cPanel (Production)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PHP_VERSION: '8.2'
  DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create bootstrap cache directory
        run: mkdir -p bootstrap/cache

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install production dependencies
        run: composer install --prefer-dist --no-dev --no-progress --no-interaction --optimize-autoloader

      - name: Create .env file
        run: |
          cat > .env << 'ENVFILE'
          APP_NAME="Genie InfoTech API"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY_PROD }}
          APP_DEBUG=false
          APP_TIMEZONE=Asia/Dhaka
          APP_URL=https://api.genieinfo.tech

          FRONTEND_URL=https://genieinfo.tech

          LOG_CHANNEL=daily
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=genieinfo_genie_api
          DB_USERNAME=genieinfo_genie_api
          DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          CACHE_STORE=file
          QUEUE_CONNECTION=sync

          MAIL_MAILER=smtp
          MAIL_HOST=s9623.fra1.stableserver.net
          MAIL_PORT=465
          MAIL_USERNAME=noreply@genieinfo.tech
          MAIL_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          MAIL_ENCRYPTION=ssl
          MAIL_FROM_ADDRESS="noreply@genieinfo.tech"
          MAIL_FROM_NAME="Genie InfoTech"

          NOTIFICATION_EMAILS="contact@genieinfo.tech,genie.projectmanager@gmail.com"

          SANCTUM_STATEFUL_DOMAINS=genieinfo.tech,www.genieinfo.tech
          SESSION_DOMAIN=.genieinfo.tech

          FILAMENT_PATH=admin
          ENVFILE

      - name: Create post-deploy script
        run: |
          cat > public/deploy.php << 'DEPLOYSCRIPT'
          <?php
          // Security: Only allow with correct secret
          $secret = $_GET['secret'] ?? '';
          $expectedSecret = getenv('DEPLOY_SECRET') ?: '${{ secrets.DEPLOY_SECRET }}';

          if ($secret !== $expectedSecret) {
              http_response_code(403);
              die('Forbidden');
          }

          header('Content-Type: text/plain');

          $basePath = dirname(__DIR__);
          chdir($basePath);

          echo "=== Genie API Deployment ===\n\n";

          // Generate key if not set
          $envContent = file_get_contents('.env');
          if (strpos($envContent, 'APP_KEY=base64:') === false) {
              echo "Generating APP_KEY...\n";
              passthru('php artisan key:generate --force 2>&1');
          }

          // Run migrations
          echo "\nRunning migrations...\n";
          passthru('php artisan migrate --force 2>&1');

          // Clear and cache
          echo "\nOptimizing...\n";
          passthru('php artisan optimize:clear 2>&1');
          passthru('php artisan config:cache 2>&1');
          passthru('php artisan route:cache 2>&1');
          passthru('php artisan view:cache 2>&1');

          // Set permissions
          echo "\nSetting permissions...\n";
          passthru('chmod -R 775 storage bootstrap/cache 2>&1');

          echo "\n=== Deployment Complete ===\n";
          DEPLOYSCRIPT

      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          # Copy application files
          cp -r app deploy/
          cp -r bootstrap deploy/
          cp -r config deploy/
          cp -r database deploy/
          cp -r public deploy/
          cp -r resources deploy/
          cp -r routes deploy/
          cp -r storage deploy/
          cp -r vendor deploy/

          cp .env deploy/
          cp artisan deploy/
          cp composer.json deploy/
          cp composer.lock deploy/

          # Ensure storage directories exist
          mkdir -p deploy/storage/app/public
          mkdir -p deploy/storage/framework/cache/data
          mkdir -p deploy/storage/framework/sessions
          mkdir -p deploy/storage/framework/views
          mkdir -p deploy/storage/logs
          mkdir -p deploy/bootstrap/cache

          # Create .htaccess for storage
          echo "Deny from all" > deploy/storage/.htaccess
          echo "Deny from all" > deploy/bootstrap/cache/.htaccess

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./api.genieinfo.tech/
          dangerous-clean-slate: false

      - name: Run post-deployment tasks
        run: |
          echo "Waiting for FTP sync..."
          sleep 10
          echo "Running post-deploy script..."
          curl -s "https://api.genieinfo.tech/deploy.php?secret=${{ secrets.DEPLOY_SECRET }}" || echo "Deploy script call completed"

      - name: Cleanup deploy script (security)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ./api.genieinfo.tech/public/
          dangerous-clean-slate: false
          exclude: |
            deploy.php

      - name: Notify deployment success
        if: success()
        run: echo "Production deployment completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "Production deployment failed. Please check the logs above."
